name: CD Deployment Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_testsuite:
        description: "Skip running ATF test suite"
        required: false
        default: false
        type: boolean
      promote_prod:
        description: "Promote to Production after publishing"
        required: false
        default: false
        type: boolean

jobs:
  verify-build:
    name: Verify & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code Quality Checks
        run: |
          pnpm fmt:check
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Verify build with frozenKeys
        run: pnpm ci:build

  deploy-test:
    name: Deploy to Test & Run ATF
    needs: verify-build
    runs-on: ubuntu-latest
    environment: test
    env:
      SN_SDK_NODE_ENV: SN_SDK_CI_INSTALL
      SN_SDK_AUTH_TYPE: ${{ secrets.SN_TEST_AUTH_TYPE || 'oauth' }}
      SN_SDK_INSTANCE_URL: ${{ secrets.SN_TEST_INSTANCE_URL }}
      SN_SDK_OAUTH_CLIENT_ID: ${{ secrets.SN_TEST_OAUTH_CLIENT_ID }}
      SN_SDK_OAUTH_CLIENT_SECRET: ${{ secrets.SN_TEST_OAUTH_CLIENT_SECRET }}
      SN_SDK_USER: ${{ secrets.SN_TEST_USER }}
      SN_SDK_USER_PWD: ${{ secrets.SN_TEST_USER_PWD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy application to Test Instance
        run: pnpm ci:install

      - name: Run ATF Test Suite
        if: ${{ !inputs.skip_testsuite }}
        run: pnpm ci:testsuite

  publish-app-repo:
    name: Publish to App Repo
    needs: deploy-test
    runs-on: ubuntu-latest
    environment: test
    env:
      SN_SDK_NODE_ENV: SN_SDK_CI_INSTALL
      SN_SDK_AUTH_TYPE: ${{ secrets.SN_TEST_AUTH_TYPE || 'oauth' }}
      SN_SDK_INSTANCE_URL: ${{ secrets.SN_TEST_INSTANCE_URL }}
      SN_SDK_OAUTH_CLIENT_ID: ${{ secrets.SN_TEST_OAUTH_CLIENT_ID }}
      SN_SDK_OAUTH_CLIENT_SECRET: ${{ secrets.SN_TEST_OAUTH_CLIENT_SECRET }}
      SN_SDK_USER: ${{ secrets.SN_TEST_USER }}
      SN_SDK_USER_PWD: ${{ secrets.SN_TEST_USER_PWD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to ServiceNow Application Repository
        run: pnpm ci:publish

  promote-production:
    name: Promote to Production
    needs: publish-app-repo
    if: ${{ github.event_name == 'push' || inputs.promote_prod }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SN_SDK_NODE_ENV: SN_SDK_CI_INSTALL
      SN_SDK_AUTH_TYPE: ${{ secrets.SN_PROD_AUTH_TYPE || 'oauth' }}
      SN_SDK_INSTANCE_URL: ${{ secrets.SN_PROD_INSTANCE_URL }}
      SN_SDK_OAUTH_CLIENT_ID: ${{ secrets.SN_PROD_OAUTH_CLIENT_ID }}
      SN_SDK_OAUTH_CLIENT_SECRET: ${{ secrets.SN_PROD_OAUTH_CLIENT_SECRET }}
      SN_SDK_USER: ${{ secrets.SN_PROD_USER }}
      SN_SDK_USER_PWD: ${{ secrets.SN_PROD_USER_PWD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install published app from App Repo into Production
        run: pnpm ci:promote
